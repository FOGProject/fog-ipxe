name: Build iPXE binaries

# Push a tag to cut a release. Every other trigger builds without publishing,
# so a pull request still proves the tree compiles -- which is the point of
# moving these binaries out of fogproject in the first place: builds nobody
# can reproduce are how the stale Makefile.housekeeping overlay and the
# disabled BIOS console both went unnoticed for years.
on:
  push:
    tags: ['v*']
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # github.ref_name is "<n>/merge" on a pull_request, which contains a slash
      # and is therefore not a legal filename -- `tar -czf fog-ipxe-1/merge...`
      # fails with "Cannot open: No such file or directory". Only tag builds
      # publish, so every other build just needs a name that proves packaging
      # works. Went unnoticed because this repository had had no pull requests.
      PKGVER: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential liblzma-dev mtools xorriso isolinux \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu perl git \
            sbsigntool

      - name: Build
        # No cert argument: release binaries are the generic ones. An install
        # that needs its own CA baked in builds locally, because that is a
        # per-server artifact by definition.
        run: ./buildipxe.sh

      - name: Check for iPXE option drift
        # Fails when a shipped binary's feature set changes without the matching
        # baseline being updated in the same commit. Ten options were lost to a
        # single wholesale header copy and took six releases to find, one
        # symptom report at a time; this is what makes the eleventh impossible
        # to ship unnoticed. See tools/check-linked-objects.sh for the history.
        #
        # Deliberately AFTER the build and BEFORE publishing: a tag build that
        # trips this stops without cutting a release, which is the whole point.
        run: ./tools/check-linked-objects.sh

      - name: Stage Secure Boot asset set
        # Published as a SEPARATE asset, not folded into the main tarball, for
        # two reasons: everything in the main tarball is a binary this workflow
        # built, and these are not -- they are upstream's, republished; and a
        # site that does not want third-party signed blobs can simply not fetch
        # this one.
        #
        # Runs on every trigger, not just tags, so a PR proves the pins still
        # resolve and the signers still match. Finding out at tag time that
        # upstream rotated a certificate is finding out too late.
        run: ./secureboot/stage.sh sb-output

      - name: Package
        # One tarball, not 85 loose assets. Release assets cannot contain
        # directories, so publishing them individually would mean mangling
        # every path into a flat name and teaching the installer to unmangle
        # it. The tree has structure -- i386-efi/, arm64-efi/, 10secdelay/ --
        # and a tarball preserves it for free. A single checksum then covers
        # every file, rather than 85 chances to get one verification wrong.
        run: |
          tar -czf fog-ipxe-${PKGVER}.tar.gz -C output .
          # Plain `sha256sum -c`-consumable form, matching how the FOS
          # release hashes are shaped, so the installer can verify it with the
          # same loop it already uses.
          sha256sum fog-ipxe-${PKGVER}.tar.gz \
            > fog-ipxe-${PKGVER}.tar.gz.sha256
          cat fog-ipxe-${PKGVER}.tar.gz.sha256

          # Same shape for the Secure Boot set, so the installer can verify it
          # with the loop it already uses for the other two.
          tar -czf fog-ipxe-secureboot-${PKGVER}.tar.gz -C sb-output .
          sha256sum fog-ipxe-secureboot-${PKGVER}.tar.gz \
            > fog-ipxe-secureboot-${PKGVER}.tar.gz.sha256
          cat fog-ipxe-secureboot-${PKGVER}.tar.gz.sha256

      - name: Upload build artefacts
        # Keeps a downloadable tree on every PR and branch build, so a change
        # can be inspected before anyone tags it.
        uses: actions/upload-artifact@v4
        with:
          name: ipxe-binaries
          path: output/

      - name: Upload Secure Boot artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ipxe-secureboot
          path: sb-output/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "fog-ipxe-${PKGVER}.tar.gz" \
            "fog-ipxe-${PKGVER}.tar.gz.sha256" \
            "fog-ipxe-secureboot-${PKGVER}.tar.gz" \
            "fog-ipxe-secureboot-${PKGVER}.tar.gz.sha256"
